<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapeamento de Opacidade em SVG</title>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-family: Arial, sans-serif;
    }

    /* Estilo e transição suave para os grupos do SVG */
    .grupo-mapa {
      transition: opacity 0.4s ease-in-out, fill 0.3s ease;
      cursor: pointer;
    }

    .grupo-mapa:hover {
      filter: brightness(1.1);
    }

    /* Controles de Opacidade (Controles Externos) */
    .controles {
      display: flex;
      gap: 15px;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 8px;
    }

    .controle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Mapeamento de Opacidade por Grupo</h2>

  <!-- SEU SVG / SUA IMAGEM (Substitua ou estruture com seus <g>) -->
  <svg id="meuMapa" width="400" height="300" viewBox="0 0 400 300" style="background: #e0e0e0; border-radius: 8px;">
    
    <!-- Grupo 1 -->
    <g id="grupo-1" class="grupo-mapa" style="opacity: 1;">
      <rect x="30" y="30" width="100" height="100" fill="#e74c3c" rx="10" />
      <text x="80" y="85" fill="#fff" text-anchor="middle">Grupo A</text>
    </g>

    <!-- Grupo 2 -->
    <g id="grupo-2" class="grupo-mapa" style="opacity: 1;">
      <circle cx="200" cy="80" r="50" fill="#3498db" />
      <text x="200" y="85" fill="#fff" text-anchor="middle">Grupo B</text>
    </g>

    <!-- Grupo 3 -->
    <g id="grupo-3" class="grupo-mapa" style="opacity: 1;">
      <polygon points="320,30 370,130 270,130" fill="#2ecc71" />
      <text x="320" y="105" fill="#fff" text-anchor="middle">Grupo C</text>
    </g>

  </svg>

  <!-- Painel de Controles com Sliders de Opacidade -->
  <div class="controles">
    <div class="controle-item">
      <label for="range-1">Opacidade Grupo A</label>
      <input type="range" id="range-1" min="0" max="1" step="0.05" value="1" oninput="atualizarOpacidade('grupo-1', this.value)">
    </div>

    <div class="controle-item">
      <label for="range-2">Opacidade Grupo B</label>
      <input type="range" id="range-2" min="0" max="1" step="0.05" value="1" oninput="atualizarOpacidade('grupo-2', this.value)">
    </div>

    <div class="controle-item">
      <label for="range-3">Opacidade Grupo C</label>
      <input type="range" id="range-3" min="0" max="1" step="0.05" value="1" oninput="atualizarOpacidade('grupo-3', this.value)">
    </div>
  </div>

  <!-- Exemplo de Botões de Estado Pré-definidos -->
  <div>
    <button onclick="destacarApenas('grupo-1')">Focar em A</button>
    <button onclick="destacarApenas('grupo-2')">Focar em B</button>
    <button onclick="destacarApenas('grupo-3')">Focar em C</button>
    <button onclick="resetarOpacidade()">Mostrar Todos</button>
  </div>
</div>

<script>
  // Função para atualizar a opacidade de um grupo individual
  function atualizarOpacidade(idGrupo, valorOpacidade) {
    const grupo = document.getElementById(idGrupo);
    if (grupo) {
      grupo.style.opacity = valorOpacidade;
    }
  }

  // Função para destacar apenas um grupo específico (reduz a opacidade dos outros)
  function destacarApenas(idGrupoAtivo) {
    const todosGrupos = document.querySelectorAll('.grupo-mapa');
    
    todosGrupos.forEach(grupo => {
      const slider = document.querySelector(`input[oninput*="${grupo.id}"]`);
      if (grupo.id === idGrupoAtivo) {
        grupo.style.opacity = '1';
        if (slider) slider.value = '1';
      } else {
        grupo.style.opacity = '0.25'; // Deixa semi-transparente
        if (slider) slider.value = '0.25';
      }
    });
  }

  // Função para restaurar a opacidade total de todos os grupos
  function resetarOpacidade() {
    const todosGrupos = document.querySelectorAll('.grupo-mapa');
    todosGrupos.forEach(grupo => {
      grupo.style.opacity = '1';
      const slider = document.querySelector(`input[oninput*="${grupo.id}"]`);
      if (slider) slider.value = '1';
    });
  }
</script>

</body>
</html>
