<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anatomia Muscular Interativa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 30px;
      padding: 20px;
      background-color: #121212;
      color: #fff;
    }

    /* Container do Mapa Anatômico */
    .map-container {
      position: relative;
      width: 500px; /* Ajuste para o tamanho desejado */
      height: 750px;
      user-select: none;
    }

    /* Imagem principal com transparência base */
    .map-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.25; /* Imagem quase transparente por padrão */
      transition: opacity 0.3s ease;
    }

    /* Camada SVG por cima da imagem para destacar as regiões */
    .svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Deixa cliques passarem se necessário */
    }

    /* Estilo genérico das regiões destacadas */
    .muscle-region {
      opacity: 0;
      transition: opacity 0.3s ease, fill-opacity 0.3s ease;
    }

    /* Classe ativa quando o checkbox está marcado */
    .muscle-region.active {
      opacity: 1;
    }

    /* Lista lateral de seleção */
    .muscle-list {
      max-height: 750px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 15px;
      width: 280px;
    }

    .muscle-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #1e1e1e;
      border-radius: 4px;
      cursor: pointer;
    }

    .muscle-item:hover {
      background: #2a2a2a;
    }

    .muscle-item input {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ÁREA DA IMAGEM E SVG -->
  <div class="map-container">
    <img src="anatomia.jpg" class="map-image" alt="Anatomia Muscular">

    <!-- Máscara SVG sobreposta com as coordenadas exatas das regiões -->
    <svg class="svg-overlay" viewBox="0 0 500 750">
      
      <!-- Exemplo Região 1: Pescoço (Frente) -->
      <g id="region-1" class="muscle-region">
        <path d="M 235 150 L 265 150 L 260 180 L 240 180 Z" fill="#ff4d4d" fill-opacity="0.6" stroke="#ff0000" stroke-width="2"/>
      </g>

      <!-- Exemplo Região 2: Trapézio (Frente) -->
      <g id="region-2" class="muscle-region">
        <path d="M 210 180 L 240 180 L 230 205 L 195 195 Z" fill="#ff9900" fill-opacity="0.6" stroke="#ff9900" stroke-width="2"/>
        <path d="M 260 180 L 290 180 L 305 195 L 270 205 Z" fill="#ff9900" fill-opacity="0.6" stroke="#ff9900" stroke-width="2"/>
      </g>

      <!-- Exemplo Região 3: Peitoral Maior -->
      <g id="region-3" class="muscle-region">
        <path d="M 195 200 L 245 205 L 245 260 L 180 240 Z" fill="#ff6600" fill-opacity="0.6" stroke="#ff6600" stroke-width="2"/>
        <path d="M 255 205 L 305 200 L 320 240 L 255 260 Z" fill="#ff6600" fill-opacity="0.6" stroke="#ff6600" stroke-width="2"/>
      </g>

      <!-- Exemplo Região 15: Bíceps -->
      <g id="region-15" class="muscle-region">
        <path d="M 140 250 C 150 250, 155 290, 145 320 C 135 320, 130 280, 140 250 Z" fill="#00ccff" fill-opacity="0.6" stroke="#00ccff" stroke-width="2"/>
      </g>

    </svg>
  </div>

  <!-- LISTA DE CHECKBOXES -->
  <div class="muscle-list">
    <h3>Músculos</h3>

    <label class="muscle-item">
      <input type="checkbox" onchange="toggleMuscle('region-1', this.checked)">
      1: Pescoço
    </label>

    <label class="muscle-item">
      <input type="checkbox" onchange="toggleMuscle('region-2', this.checked)">
      2: Trapezius
    </label>

    <label class="muscle-item">
      <input type="checkbox" onchange="toggleMuscle('region-3', this.checked)">
      3: Pectoralis Major
    </label>

    <label class="muscle-item">
      <input type="checkbox" onchange="toggleMuscle('region-15', this.checked)">
      15: Biceps
    </label>

  </div>

  <script>
    function toggleMuscle(regionId, isChecked) {
      const element = document.getElementById(regionId);
      if (element) {
        if (isChecked) {
          element.classList.add('active');
        } else {
          element.classList.remove('active');
        }
      }
    }
  </script>

</body>
</html>
